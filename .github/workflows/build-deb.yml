name: build-deb

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  # Upstream tag to build. Bump together with the patch if Server.c changes.
  SOFTETHER_VERSION: '5.2.5189'

# the build jobs only read the repo; the release job asks for write access
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.distro }}-${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            release: trixie
            image: 'debian:trixie'
          - distro: ubuntu
            release: '26.04'
            image: 'ubuntu:26.04'
    container:
      image: ${{ matrix.image }}

    steps:
      # git is needed by actions/checkout and is not part of the base images
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config dpkg-dev fakeroot file git curl ca-certificates xz-utils \
            libssl-dev zlib1g-dev libsodium-dev libreadline-dev libncurses-dev
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          uname -m
          cmake --version | head -1
          cc --version | head -1
          dpkg --version | head -1

      - name: Build the .deb packages
        env:
          DISTRO: ${{ matrix.distro }}
          DISTRO_RELEASE: ${{ matrix.release }}
        run: ./scripts/build-deb.sh

      - name: Upload the .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: softether-deb-${{ matrix.distro }}-${{ matrix.release }}
          path: out/${{ matrix.distro }}-${{ matrix.release }}/*
          if-no-files-found: error

  # Tag pushes also publish a GitHub release with the packages attached. The
  # .deb names are identical for both distributions, so they get a suffix here.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: softether-deb-*

      - name: Rename the packages per distribution
        run: |
          set -eu
          mkdir -p assets
          for dir in dist/softether-deb-*; do
            distro=${dir#dist/softether-deb-}
            for deb in "$dir"/*.deb; do
              base=$(basename "$deb" .deb)
              cp "$deb" "assets/${base}.${distro}.deb"
            done
          done
          cd assets
          sha256sum ./*.deb >SHA256SUMS
          ls -l

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cat >notes.md <<EOF
          SoftEther VPN ${SOFTETHER_VERSION}, built from the official upstream
          release for Debian 13 (trixie) and Ubuntu 26.04, with one local patch:
          the two assignments of \`is_restricted\` in \`src/Cedar/Server.c\` are
          commented out, so the enterprise feature flags (push route, RADIUS,
          certificate auth, deep logging, access control, syslog) stay enabled.

          Install the common package together with the component you want:

          \`\`\`sh
          sudo apt install ./softether-common_*.deb ./softether-vpnserver_*.deb
          \`\`\`

          Assets are suffixed with the distribution they were built on.
          EOF
          # no checkout in this job, so tell gh which repository it is
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$REPO" assets/*.deb assets/SHA256SUMS --clobber
          else
            gh release create "$TAG" -R "$REPO" assets/*.deb assets/SHA256SUMS \
              --title "SoftEther VPN ${SOFTETHER_VERSION} (patched .deb)" \
              --notes-file notes.md
          fi
          gh release view "$TAG" -R "$REPO" --json url -q .url
